services:

  db:
    image: postgres:15
    container_name: enrutaco-db
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      TZ: ${TZ}

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

    volumes:
      - postgres_data:/var/lib/postgresql/data

    ports:
      - "${PG_PORT}:5432"

    networks:
      - enrutaco-network

  odoo:
    image: odoo:${ODOO_VERSION}
    container_name: enrutaco-odoo
    restart: unless-stopped

    depends_on:
      db:
        condition: service_healthy

    environment:
      HOST: db
      USER: ${POSTGRES_USER}
      PASSWORD: ${POSTGRES_PASSWORD}
      TZ: ${TZ}

    ports:
      - "${ODOO_PORT}:8069"

    volumes:
      - ./config/odoo.conf:/etc/odoo/odoo.conf:ro
      - ./addons:/mnt/extra-addons
      - odoo_data:/var/lib/odoo

    networks:
      - enrutaco-network

networks:
  enrutaco-network:
    driver: bridge

volumes:
  postgres_data:
    name: enrutaco_postgres_data

  odoo_data:
    name: enrutaco_odoo_data